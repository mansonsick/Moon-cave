<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes, viewport-fit=cover">
  <meta name="theme-color" content="#f5eddc">
  <meta name="description" content="跟著阿通，選國文、數學或英文冒險，讀故事、做練習，發現藏在畫面中的祕密。">
  <title>阿通的冒險世界</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      color: #302e24;
      background: #f5eddc;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 280px; background: radial-gradient(ellipse at 85% 0, #e0e9d8, transparent 55%); }
    main {
      width: min(100% - 48px, 1080px);
      margin: 0 auto;
      padding: max(36px, env(safe-area-inset-top)) 0 max(40px, env(safe-area-inset-bottom));
    }
    .welcome { text-align: center; margin-bottom: 32px; }
    .world-mark { display: inline-flex; align-items: center; gap: 12px; color: #627357; margin-bottom: 8px; }
    .world-mark::before, .world-mark::after { content: ""; width: 46px; height: 1px; background: #aab895; }
    .world-mark svg { width: 38px; height: 38px; }
    .text-image { display: block; max-width: 100%; height: auto; }
    h1 { margin: 0 0 20px; }
    h1 img { width: min(100%, 42rem); margin: auto; }
    .welcome p { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 12px; margin: 0; }
    .welcome p img { width: auto; max-width: 100%; height: 38px; object-fit: contain; }
    .subject-nav { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin: 28px 0 48px; }
    .subject-entry { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; min-height: 156px; padding: 22px 12px; border: 2px solid #bacab5; border-radius: 22px; background: #e9f1e1; text-decoration: none; color: #284c3e; touch-action: manipulation; }
    .subject-entry[data-subject="math"] { background: #fff0c9; border-color: #d8c18c; color: #6b4b20; }
    .subject-entry[data-subject="english"] { background: #e6eff7; border-color: #b2c8dc; color: #284b65; }
    .subject-entry svg { width: 46px; height: 46px; }
    .subject-entry .text-image { width: min(100%, 122px); }
    .subject-entry:active { transform: translateY(2px); }
    .subject-section { margin-top: 42px; scroll-margin-top: 20px; }
    .subject-heading { display: flex; flex-wrap: wrap; align-items: center; gap: 16px 24px; margin-bottom: 24px; }
    .subject-heading h2 { width: auto; }
    .subject-heading h2 img { width: 132px; }
    .subject-heading p { margin: 0; }
    .subject-heading p img { width: min(100%, 330px); }
    .subject-return { display: inline-flex; min-height: 56px; align-items: center; justify-content: center; margin-top: 20px; padding: 12px 18px; border: 1px solid #a7b89c; border-radius: 14px; background: #e9f1e1; touch-action: manipulation; }
    .subject-return img { width: 156px; }
    .empty-subject { display: grid; justify-items: center; gap: 16px; padding: 38px 24px; border: 2px dashed #b2c8dc; border-radius: 22px; background: #eef4f9; }
    .empty-subject img { width: min(100%, 340px); }
    .story-card {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border: 1px solid #d6c9ac;
      border-radius: 28px;
      overflow: hidden;
      background: #fffaf0;
      box-shadow: 0 14px 44px #5d503c18;
    }
    .story-card + .story-card { margin-top: 36px; }
    .cover-link { display: flex; align-items: center; justify-content: center; background: #221d17; }
    .cover-link img { width: 100%; height: auto; display: block; }
    .story-info { padding: clamp(24px, 4vw, 48px); display: flex; flex-direction: column; align-items: flex-start; justify-content: center; }
    .chapter { margin: 0 0 20px; width: 100%; }
    .chapter img { width: 100%; height: 32px; object-fit: contain; object-position: left; }
    h2 { margin: 0; width: 100%; }
    h2 img { width: min(100%, 28rem); }
    .description { margin: 22px 0 30px; width: min(100%, 32rem); display: grid; gap: 12px; }
    .description img { width: 100%; height: auto; }
    /* Match the PNG widths so all three lines use the same character size. */
    .description img:nth-child(2) { width: calc(100% * 1752 / 2616); }
    .story-card[data-story="story-02"] .description img:nth-child(2) { width: calc(100% * 1464 / 2616); }
    .story-card[data-story="story-03"] .description img:nth-child(2) { width: 100%; }
    .hub-stage { width: 100%; position: relative; aspect-ratio: 16/9; overflow: hidden; }
    .hub-stage .hub-background { width: 100%; height: 100%; max-height: none; object-fit: fill; }
    .hub-stage .hub-person { position: absolute; left: 37%; top: 21%; width: 26%; height: 65%; object-fit: contain; }
    .hub-stage .hub-squirrel { position: absolute; left: 66%; top: 58%; width: 13%; height: 28%; object-fit: contain; }
    .story-card[data-story="story-04"] .hub-person { left: 16%; top: 20%; width: 26%; height: 74%; }
    .story-card[data-story="story-04"] .hub-squirrel { left: 2%; top: 62%; width: 18%; height: 30%; }
    .story-card[data-story="story-04"] .reading-hub-text { font-size: 24px; line-height: 1.7; }
    .story-card[data-story="story-04"] h2.reading-hub-text { font-size: 30px; }
    .story-card[data-story="story-04"] .chapter.reading-hub-text { font-size: 20px; }
    .story-card[data-story="story-04"] .reading-hub-text img { display: inline; width: auto; height: 1.12em; max-width: 100%; vertical-align: middle; }
    .start {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      width: 100%;
      min-height: 76px;
      padding: 16px 24px;
      border-radius: 18px;
      background: #285641;
      color: #fffaf0;
      font-size: 30px;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 4px 0 #183d2e;
      touch-action: manipulation;
    }
    .start img { width: auto; max-width: calc(100% - 40px); height: 42px; object-fit: contain; }
    .start:active { transform: translateY(2px); box-shadow: 0 2px 0 #183d2e; }
    a:focus-visible { outline: 4px solid #b66b1d; outline-offset: -6px; }
    .start:focus-visible { outline-offset: 5px; }
    @media (hover: hover) { .start:hover { background: #1d4735; } }
    @media (max-width: 899px) {
      main { max-width: 680px; }
      .story-card { grid-template-columns: 1fr; }
      .cover-link img { width: auto; max-width: 100%; max-height: 52svh; object-fit: contain; }
      .story-info { padding: 26px 30px 32px; align-items: center; text-align: center; }
      .chapter { margin-bottom: 8px; }
      h2 img { margin: auto; }
      .chapter img, .description img { object-position: center; }
      .description { justify-items: center; }
      .description { margin: 12px 0 24px; }
    }
    @media (max-width: 480px) {
      main { width: calc(100% - 28px); padding-top: 24px; }
      .welcome { margin-bottom: 24px; }
      .story-card { border-radius: 22px; }
      .story-info { padding: 22px 18px 26px; }
      .start { min-height: 68px; font-size: 26px; }
      .welcome p img { height: 32px; }
      .subject-nav { gap: 8px; margin-bottom: 30px; }
      .subject-entry { min-height: 128px; padding: 16px 8px; border-radius: 16px; }
      .subject-entry svg { width: 36px; height: 36px; }
      .subject-heading { gap: 12px; }
    }
  </style>
</head>
<body>
  <main>
    <header class="welcome">
      <span class="world-mark" aria-hidden="true">
        <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 10c-5-4-10-4-16-2v24c6-2 11-2 16 2 5-4 10-4 16-2V8c-6-2-11-2-16 2Z"/>
          <path d="M20 10v24M9 14l6 1M9 20l6 1M25 15l6-1M25 21l6-1"/>
        </svg>
      </span>
      <h1><img class="text-image" src="./assets/hub-text/world-title.png" alt="阿通的冒險世界" width="2040" height="207"></h1>
      <p><img class="text-image" src="./assets/hub-text/subject-help-first.png" alt="今天想學什麼？"><img class="text-image" src="./assets/hub-text/subject-help-second.png" alt="選一個入口吧！"></p>
    </header>
    <nav class="subject-nav" id="subjects" aria-label="選擇科目">
      <a class="subject-entry" data-subject="chinese" href="#chinese">
        <svg aria-hidden="true" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"><path d="M24 11C17 6 9 7 4 9v30c7-2 14-2 20 2 6-4 13-4 20-2V9c-5-2-13-3-20 2Z"/><path d="M24 11v30M10 16l8 1M10 24l8 1M30 17l8-1M30 25l8-1"/></svg>
        <img class="text-image" src="./assets/hub-text/subject-chinese.png" alt="國文">
      </a>
      <a class="subject-entry" data-subject="math" href="#math">
        <svg aria-hidden="true" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M8 14h14M15 7v14M31 10l10 10M41 10L31 20M8 34h14M29 31h14M29 38h14"/></svg>
        <img class="text-image" src="./assets/hub-text/subject-math.png" alt="數學">
      </a>
      <a class="subject-entry" data-subject="english" href="#english">
        <svg aria-hidden="true" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 35 15 9l8 26M10 26h10M29 10v25h8c10 0 10-12 0-12h-8M29 10h7c9 0 9 13 0 13"/></svg>
        <img class="text-image" src="./assets/hub-text/subject-english.png" alt="英文">
      </a>
    </nav>
    <section class="subject-section" id="chinese" aria-labelledby="chinese-title">
      <header class="subject-heading"><h2 id="chinese-title"><img class="text-image" src="./assets/hub-text/subject-chinese.png" alt="國文"></h2><p><img class="text-image" src="./assets/hub-text/chinese-caption.png" alt="讀故事，練習國語。"></p></header>
    <article class="story-card" data-story="moon-cave" aria-labelledby="moon-cave-title">
      <a class="cover-link" href="./stories/moon-cave/" aria-label="進入月光洞的祕密">
        <img src="./assets/moon-cave-cover.webp" width="1055" height="1491" alt="月光照進古老洞穴，石階、蜘蛛網與寶箱藏在其中。" fetchpriority="high">
      </a>
      <div class="story-info">
        <p class="chapter"><img class="text-image" src="./assets/hub-text/chapter.png" alt="阿通的第一場冒險" width="2328" height="207"></p>
        <h2 id="moon-cave-title"><img class="text-image" src="./assets/hub-text/story-title.png" alt="月光洞的祕密" width="1752" height="207"></h2>
        <p class="description"><img class="text-image" src="./assets/hub-text/description-first.png" alt="跟著阿通和小松鼠，" width="2616" height="207"><img class="text-image" src="./assets/hub-text/description-second.png" alt="走進月光洞，" width="1752" height="207"><img class="text-image" src="./assets/hub-text/description-third.png" alt="找找藏起來的祕密。" width="2616" height="207"></p>
        <a class="start" href="./stories/moon-cave/"><img class="text-image" src="./assets/hub-text/start.png" alt="開始冒險" width="1176" height="207"><span aria-hidden="true">→</span></a>
      </div>
    </article>
    <article class="story-card" data-story="story-02" aria-labelledby="story-02-title">
      <a class="cover-link" href="./stories/story-02/" aria-label="進入陌生山路的冒險">
        <img src="./stories/story-02/assets/images/warm-house.png" width="1672" height="941" alt="阿通和小松鼠走到山中的木屋前，窗戶透出溫暖的燈光。" loading="lazy" decoding="async">
      </a>
      <div class="story-info">
        <p class="chapter"><img class="text-image" src="./assets/hub-text/story-02-chapter.png" alt="阿通的第二場冒險" width="2328" height="207"></p>
        <h2 id="story-02-title"><img class="text-image" src="./assets/hub-text/story-02-title.png" alt="陌生山路的冒險" width="2040" height="207"></h2>
        <p class="description"><img class="text-image" src="./assets/hub-text/description-first.png" alt="跟著阿通和小松鼠，" width="2616" height="207"><img class="text-image" src="./assets/hub-text/story-02-description-second.png" alt="觀察山屋，" width="1464" height="207"><img class="text-image" src="./assets/hub-text/story-02-description-third.png" alt="找出安全回家的路。" width="2616" height="207"></p>
        <a class="start" href="./stories/story-02/"><img class="text-image" src="./assets/hub-text/start.png" alt="開始冒險" width="1176" height="207"><span aria-hidden="true">→</span></a>
      </div>
    </article>
    <article class="story-card" data-story="story-04" aria-labelledby="story-04-title">
      <a class="cover-link" href="./stories/story-04/" aria-label="進入阿通與森林郵局">
        <div class="hub-stage">
          <img class="hub-background" src="./stories/story-04/assets/images/postoffice-opening.png" width="1672" height="941" alt="阿通和小松鼠走到森林郵局，準備幫朋友送信。" loading="lazy" decoding="async">
          <img class="hub-person" src="./stories/story-04/assets/images/atong-walking.png" alt="" loading="lazy" decoding="async">
          <img class="hub-squirrel" src="./stories/story-04/assets/images/squirrel-pointing.png" alt="" loading="lazy" decoding="async">
        </div>
      </a>
      <div class="story-info">
        <p class="chapter reading-hub-text" role="img" aria-label="阿通的第四場冒險"><img src="./stories/story-04/assets/text/hub-chapter-0.png" alt=""><img src="./stories/story-04/assets/text/hub-chapter-1.png" alt=""></p>
        <h2 id="story-04-title" class="reading-hub-text" aria-label="阿通與森林郵局"><img src="./stories/story-04/assets/text/title-0.png" alt="阿通與森林"><img src="./stories/story-04/assets/text/title-1.png" alt="郵局"></h2>
        <p class="description reading-hub-text"><span role="img" aria-label="看看圖，讀一讀，"><img src="./stories/story-04/assets/text/hub-first-0.png" alt=""><img src="./stories/story-04/assets/text/hub-first-1.png" alt=""></span><span role="img" aria-label="一起把信送到森林朋友手中。"><img src="./stories/story-04/assets/text/hub-second-0.png" alt=""><img src="./stories/story-04/assets/text/hub-second-1.png" alt=""><img src="./stories/story-04/assets/text/hub-second-2.png" alt=""></span></p>
        <a class="start" href="./stories/story-04/"><img class="text-image" src="./assets/hub-text/start.png" alt="開始冒險" width="1176" height="207"><span aria-hidden="true">→</span></a>
      </div>
    </article>
      <a class="subject-return" href="#subjects"><img class="text-image" src="./assets/hub-text/subject-back.png" alt="重新選科目"></a>
    </section>
    <section class="subject-section" id="math" aria-labelledby="math-title">
      <header class="subject-heading"><h2 id="math-title"><img class="text-image" src="./assets/hub-text/subject-math.png" alt="數學"></h2><p><img class="text-image" src="./assets/hub-text/math-caption.png" alt="算一算，解開謎題。"></p></header>
    <article class="story-card" data-story="story-03" aria-labelledby="story-03-title">
      <a class="cover-link" href="./stories/story-03/" aria-label="進入阿通與星光寶箱">
        <div class="hub-stage">
          <img class="hub-background" src="./stories/story-03/assets/images/courtyard-bg.png" width="1672" height="941" alt="阿通和小松鼠在星塔庭院，一起喚醒星光。" loading="lazy" decoding="async">
          <img class="hub-person" src="./stories/story-03/assets/images/atong-jump.png" alt="" loading="lazy" decoding="async">
          <img class="hub-squirrel" src="./stories/story-03/assets/images/squirrel.png" alt="" loading="lazy" decoding="async">
        </div>
      </a>
      <div class="story-info">
        <p class="chapter"><img class="text-image" src="./assets/hub-text/story-03-hub-chapter.png" alt="阿通的第三場冒險" width="2328" height="207"></p>
        <h2 id="story-03-title"><img class="text-image" src="./assets/hub-text/story-03-title.png" alt="阿通與星光寶箱" width="2040" height="207"></h2>
        <p class="description"><img class="text-image" src="./assets/hub-text/story-03-hub-description-first.png" alt="算一算，解開星塔的門，" width="3192" height="207"><img class="text-image" src="./assets/hub-text/story-03-hub-description-second.png" alt="動一動，找回森林星光。" width="3192" height="207"></p>
        <a class="start" href="./stories/story-03/"><img class="text-image" src="./assets/hub-text/start.png" alt="開始冒險" width="1176" height="207"><span aria-hidden="true">→</span></a>
      </div>
    </article>
      <a class="subject-return" href="#subjects"><img class="text-image" src="./assets/hub-text/subject-back.png" alt="重新選科目"></a>
    </section>
    <section class="subject-section" id="english" aria-labelledby="english-title">
      <header class="subject-heading"><h2 id="english-title"><img class="text-image" src="./assets/hub-text/subject-english.png" alt="英文"></h2></header>
      <div class="empty-subject"><img class="text-image" src="./assets/hub-text/english-empty-first.png" alt="英文冒險準備中。"><img class="text-image" src="./assets/hub-text/english-empty-second.png" alt="先選其他故事吧！"></div>
      <a class="subject-return" href="#subjects"><img class="text-image" src="./assets/hub-text/subject-back.png" alt="重新選科目"></a>
    </section>
  </main>
</body>
</html>
