<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes, viewport-fit=cover">
  <meta name="theme-color" content="#f5eddc">
  <meta name="description" content="跟著阿通，一起走進故事裡。選一本冒險繪本，仔細觀察，發現藏在畫面中的祕密。">
  <title>阿通的冒險世界</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      color: #302e24;
      background: #f5eddc;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 280px; background: radial-gradient(ellipse at 85% 0, #e0e9d8, transparent 55%); }
    main {
      width: min(100% - 48px, 1080px);
      margin: 0 auto;
      padding: max(36px, env(safe-area-inset-top)) 0 max(40px, env(safe-area-inset-bottom));
    }
    .welcome { text-align: center; margin-bottom: 32px; }
    .world-mark { display: inline-flex; align-items: center; gap: 12px; color: #627357; margin-bottom: 8px; }
    .world-mark::before, .world-mark::after { content: ""; width: 46px; height: 1px; background: #aab895; }
    .world-mark svg { width: 38px; height: 38px; }
    .text-image { display: block; max-width: 100%; height: auto; }
    h1 { margin: 0 0 20px; }
    h1 img { width: min(100%, 42rem); margin: auto; }
    .welcome p { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 12px; margin: 0; }
    .welcome p img { width: auto; max-width: 100%; height: 38px; object-fit: contain; }
    .story-card {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border: 1px solid #d6c9ac;
      border-radius: 28px;
      overflow: hidden;
      background: #fffaf0;
      box-shadow: 0 14px 44px #5d503c18;
    }
    .story-card + .story-card { margin-top: 36px; }
    .cover-link { display: flex; align-items: center; justify-content: center; background: #221d17; }
    .cover-link img { width: 100%; height: auto; display: block; }
    .story-info { padding: clamp(24px, 4vw, 48px); display: flex; flex-direction: column; align-items: flex-start; justify-content: center; }
    .chapter { margin: 0 0 20px; width: 100%; }
    .chapter img { width: 100%; height: 32px; object-fit: contain; object-position: left; }
    h2 { margin: 0; width: 100%; }
    h2 img { width: min(100%, 28rem); }
    .description { margin: 22px 0 30px; width: min(100%, 32rem); display: grid; gap: 12px; }
    .description img { width: 100%; height: auto; }
    /* Match the PNG widths so all three lines use the same character size. */
    .description img:nth-child(2) { width: calc(100% * 1752 / 2616); }
    .story-card[data-story="story-02"] .description img:nth-child(2) { width: calc(100% * 1464 / 2616); }
    .story-card[data-story="story-03"] .description img:nth-child(2) { width: 100%; }
    .hub-stage { width: 100%; position: relative; aspect-ratio: 16/9; overflow: hidden; }
    .hub-stage .hub-background { width: 100%; height: 100%; max-height: none; object-fit: fill; }
    .hub-stage .hub-person { position: absolute; left: 37%; top: 21%; width: 26%; height: 65%; object-fit: contain; }
    .hub-stage .hub-squirrel { position: absolute; left: 66%; top: 58%; width: 13%; height: 28%; object-fit: contain; }
    .start {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      width: 100%;
      min-height: 76px;
      padding: 16px 24px;
      border-radius: 18px;
      background: #285641;
      color: #fffaf0;
      font-size: 30px;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 4px 0 #183d2e;
      touch-action: manipulation;
    }
    .start img { width: auto; max-width: calc(100% - 40px); height: 42px; object-fit: contain; }
    .start:active { transform: translateY(2px); box-shadow: 0 2px 0 #183d2e; }
    a:focus-visible { outline: 4px solid #b66b1d; outline-offset: -6px; }
    .start:focus-visible { outline-offset: 5px; }
    @media (hover: hover) { .start:hover { background: #1d4735; } }
    @media (max-width: 899px) {
      main { max-width: 680px; }
      .story-card { grid-template-columns: 1fr; }
      .cover-link img { width: auto; max-width: 100%; max-height: 52svh; object-fit: contain; }
      .story-info { padding: 26px 30px 32px; align-items: center; text-align: center; }
      .chapter { margin-bottom: 8px; }
      h2 img { margin: auto; }
      .chapter img, .description img { object-position: center; }
      .description { justify-items: center; }
      .description { margin: 12px 0 24px; }
    }
    @media (max-width: 480px) {
      main { width: calc(100% - 28px); padding-top: 24px; }
      .welcome { margin-bottom: 24px; }
      .story-card { border-radius: 22px; }
      .story-info { padding: 22px 18px 26px; }
      .start { min-height: 68px; font-size: 26px; }
      .welcome p img { height: 32px; }
    }
  </style>
</head>
<body>
  <main>
    <header class="welcome">
      <span class="world-mark" aria-hidden="true">
        <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 10c-5-4-10-4-16-2v24c6-2 11-2 16 2 5-4 10-4 16-2V8c-6-2-11-2-16 2Z"/>
          <path d="M20 10v24M9 14l6 1M9 20l6 1M25 15l6-1M25 21l6-1"/>
        </svg>
      </span>
      <h1><img class="text-image" src="./assets/hub-text/world-title.png" alt="阿通的冒險世界" width="2040" height="207"></h1>
      <p><img class="text-image" src="./assets/hub-text/welcome-first.png" alt="選一本故事，" width="1752" height="207"><img class="text-image" src="./assets/hub-text/welcome-second.png" alt="一起出發吧！" width="1752" height="207"></p>
    </header>
    <article class="story-card" data-story="moon-cave" aria-labelledby="moon-cave-title">
      <a class="cover-link" href="./stories/moon-cave/" aria-label="進入月光洞的祕密">
        <img src="./assets/moon-cave-cover.webp" width="1055" height="1491" alt="月光照進古老洞穴，石階、蜘蛛網與寶箱藏在其中。" fetchpriority="high">
      </a>
      <div class="story-info">
        <p class="chapter"><img class="text-image" src="./assets/hub-text/chapter.png" alt="阿通的第一場冒險" width="2328" height="207"></p>
        <h2 id="moon-cave-title"><img class="text-image" src="./assets/hub-text/story-title.png" alt="月光洞的祕密" width="1752" height="207"></h2>
        <p class="description"><img class="text-image" src="./assets/hub-text/description-first.png" alt="跟著阿通和小松鼠，" width="2616" height="207"><img class="text-image" src="./assets/hub-text/description-second.png" alt="走進月光洞，" width="1752" height="207"><img class="text-image" src="./assets/hub-text/description-third.png" alt="找找藏起來的祕密。" width="2616" height="207"></p>
        <a class="start" href="./stories/moon-cave/"><img class="text-image" src="./assets/hub-text/start.png" alt="開始冒險" width="1176" height="207"><span aria-hidden="true">→</span></a>
      </div>
    </article>
    <article class="story-card" data-story="story-02" aria-labelledby="story-02-title">
      <a class="cover-link" href="./stories/story-02/" aria-label="進入陌生山路的冒險">
        <img src="./stories/story-02/assets/images/warm-house.png" width="1672" height="941" alt="阿通和小松鼠走到山中的木屋前，窗戶透出溫暖的燈光。" loading="lazy" decoding="async">
      </a>
      <div class="story-info">
        <p class="chapter"><img class="text-image" src="./assets/hub-text/story-02-chapter.png" alt="阿通的第二場冒險" width="2328" height="207"></p>
        <h2 id="story-02-title"><img class="text-image" src="./assets/hub-text/story-02-title.png" alt="陌生山路的冒險" width="2040" height="207"></h2>
        <p class="description"><img class="text-image" src="./assets/hub-text/description-first.png" alt="跟著阿通和小松鼠，" width="2616" height="207"><img class="text-image" src="./assets/hub-text/story-02-description-second.png" alt="觀察山屋，" width="1464" height="207"><img class="text-image" src="./assets/hub-text/story-02-description-third.png" alt="找出安全回家的路。" width="2616" height="207"></p>
        <a class="start" href="./stories/story-02/"><img class="text-image" src="./assets/hub-text/start.png" alt="開始冒險" width="1176" height="207"><span aria-hidden="true">→</span></a>
      </div>
    </article>
    <article class="story-card" data-story="story-03" aria-labelledby="story-03-title">
      <a class="cover-link" href="./stories/story-03/" aria-label="進入阿通與星光寶箱">
        <div class="hub-stage">
          <img class="hub-background" src="./stories/story-03/assets/images/courtyard-bg.png" width="1672" height="941" alt="阿通和小松鼠在星塔庭院，一起喚醒星光。" loading="lazy" decoding="async">
          <img class="hub-person" src="./stories/story-03/assets/images/atong-jump.png" alt="" loading="lazy" decoding="async">
          <img class="hub-squirrel" src="./stories/story-03/assets/images/squirrel.png" alt="" loading="lazy" decoding="async">
        </div>
      </a>
      <div class="story-info">
        <p class="chapter"><img class="text-image" src="./assets/hub-text/story-03-hub-chapter.png" alt="阿通的第三場冒險" width="2328" height="207"></p>
        <h2 id="story-03-title"><img class="text-image" src="./assets/hub-text/story-03-title.png" alt="阿通與星光寶箱" width="2040" height="207"></h2>
        <p class="description"><img class="text-image" src="./assets/hub-text/story-03-hub-description-first.png" alt="算一算，解開星塔的門，" width="3192" height="207"><img class="text-image" src="./assets/hub-text/story-03-hub-description-second.png" alt="動一動，找回森林星光。" width="3192" height="207"></p>
        <a class="start" href="./stories/story-03/"><img class="text-image" src="./assets/hub-text/start.png" alt="開始冒險" width="1176" height="207"><span aria-hidden="true">→</span></a>
      </div>
    </article>
  </main>
</body>
</html>
